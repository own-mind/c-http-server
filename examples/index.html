<html>
    <head>
        <title>Calculator</title>
<style>
.calcCell {
    background: #dddddd;
    text-align: center;
    padding-top: 20px;
    border: 1px #eeeeee solid;
    width: 50px;
    height: 30px;
}

.calcRow {

}

</style>
    </head>
    <body>
        <h2>Calculator</h2>
        <div>
            <div class="calcRow">
                <div class="calcCell">1</div>
                <div class="calcCell">2</div>
                <div class="calcCell">3</div>
                <div class="calcCell">/</div>
            </div>
            <div class="calcRow">
                <div class="calcCell">4</div>
                <div class="calcCell">5</div>
                <div class="calcCell">6</div>
                <div class="calcCell">*</div>
            </div>
            <div class="calcRow">
                <div class="calcCell">7</div>
                <div class="calcCell">8</div>
                <div class="calcCell">9</div>
                <div class="calcCell">-<div>
            </div>
            <div class="calcRow">
                <div class="calcCell">.</div>
                <div class="calcCell">0</div>
                <div class="calcCell">=</div>
                <div class="calcCell">+<div>
            </div>
        </div>
    </body>
</html>
